# Independent local provider selections; change names to match your inventory.
shadow_skips = true

[decision]
backend = "ollaya"
endpoint = "http://localhost:11435"
model = "winnow:e4b"
timeout_seconds = 120.0

[review]
backend = "ollama"
endpoint = "http://localhost:11434"
