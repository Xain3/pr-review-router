rubric_version = 1

[[criteria]]
criterion_id = "title-format"
description = "The title follows Conventional Commits."
check = "conventional_title"
suggestion = "Use a title such as fix(average): handle empty input and raise the batch limit."

[[criteria]]
criterion_id = "summary-section"
description = "The description includes a populated Summary section."
check = "body_section"
section = "Summary"
suggestion = "Add a populated level-two Summary section."

[[criteria]]
criterion_id = "change-rationale"
description = "The description explains why the changes are needed."
check = "semantic"
target = "description"
instructions = "Does the PR description explain why each substantive change is needed? Require a specific motivating problem, need, or constraint distinct from a paraphrase of the change. Compare the Rationale with the Summary: restating what changed fails, even under a Rationale heading. For example, 'Add an empty-input guard' says what; 'Empty batches currently raise ZeroDivisionError, but callers need a numeric result' says why. Generic claims such as 'make things better' and empty or placeholder descriptions also fail. A rationale for one change does not cover another substantive change without its own reason."
suggestion = "Explain the problem each substantive change solves and why this approach was chosen."

[[criteria]]
criterion_id = "description-coverage"
description = "The description accurately covers all substantive changes in the diff."
check = "semantic"
target = "description"
instructions = "First decide whether the PR description body makes any concrete claim about what was changed. If it makes no concrete edit claim anywhere, Choose uncertain immediately; rationale or intent, the title, headings, and generic Testing or Limitations text do not count. Do not infer a description from the patches. Only when at least one concrete edit is described, assess every changed file within this single criterion, including behavior or configuration changes and accompanying tests or documentation. If any file's substantive change is omitted or misrepresented, Choose failed and briefly identify the omission; do not require the filename itself when the change is accurately described. For example, describing an empty-input guard but omitting its added test fails coverage. Choose passed only when all files' substantive changes are accurately covered. Do not judge code correctness."
suggestion = "Describe every substantive change visible in the supplied patches."

[[criteria]]
criterion_id = "review-coverage"
description = "The supplied review addresses all substantive changes in the PR."
check = "semantic"
target = "review"
instructions = "First decide whether the supplied review can be assessed against the visible patches. Choose uncertain when no review is supplied, or when it refers only to unseen discussion or unspecified items (for example 'the second change' or 'as discussed') that cannot be tied to any patch. A generic approval or title restatement is assessable but addresses no change, so choose failed. For an assessable review, internally make one checklist entry per changed file, including tests and documentation. Each entry must identify review text that addresses that file's substantive change and relevant implications. Choose passed only when every entry is covered; choose failed and identify any omission when an entry has no traceable statement, or when the review is off-target. A specific comment or open concern counts as coverage when tied to the change. Do not require literal filenames when the change is clearly identified. Assess coverage, not whether the review proves the code correct."
suggestion = "Extend the review to address each changed behavior and relevant edge cases."

[[criteria]]
criterion_id = "testing-explanation"
description = "The description records relevant validation for the changes."
check = "semantic"
target = "description"
instructions = "Does the PR description explain relevant testing or a specific reason testing is not applicable for the substantive changes in the diff? A Testing heading, 'tests pass', or 'not discussed' alone is insufficient. Assess the explanation; do not invent or claim verification of test execution."
suggestion = "Describe validation for empty input, ordinary averages, and the changed batch-size boundary."

[[criteria]]
criterion_id = "change-triviality"
description = "The supplied patches establish the actual change-triviality level."
check = "semantic"
target = "description"
instructions = "Classify the actual supplied diff using the configured scale. Judge behavior and interface impact, not the title, description, commit messages, or line count. Choose uncertain when the supplied patches do not provide enough evidence for a classification. At adjacent levels: edits to comment, documentation, or link-target prose are editorial, while any edit to code, including a rename or a user-visible string, is at least mechanical. An edit is mechanical only when the patch shows behavior is preserved (for example a literal replaced by a named constant of the same value, or a local variable renamed everywhere it is used); changing a value, default, condition, or return that can alter the output for some input is bounded_behavior. Adding a public function or parameter, or changing security-sensitive behavior such as authentication, escaping, or permissions, is substantive. If previously valid callers or configurations would stop working (a removed or renamed public name, a new required parameter, a removed configuration entrypoint), choose incompatible even when the patch updates in-repo callers; backward-compatible additions are substantive."
question_type = "choice"
suggestion = "Provide enough change evidence to support a triviality classification."
# A status records whether the change was classified; enforcement rules match the native label.
choices = [
    { label = "editorial", description = "Prose or link correction with no runtime or interface change.", status = "passed" },
    { label = "mechanical", description = "Local mechanical or presentation change that preserves behavior and public interfaces.", status = "passed" },
    { label = "bounded_behavior", description = "A local behavior or configuration change requiring edge-case review.", status = "passed" },
    { label = "substantive", description = "A new capability or security-sensitive behavior requiring broader review.", status = "passed" },
    { label = "incompatible", description = "Removal of, or incompatible change to, a supported interface or configuration that requires migration.", status = "passed" },
    { label = "uncertain", description = "The available patch evidence is insufficient to classify the change.", status = "uncertain" },
]

[[enforcement_rules]]
when = { change-triviality = ["editorial", "mechanical"] }
enforce = [
    "title-format",
    { any_of = [
        "summary-section",
        "description-coverage",
    ] },
]
soft_enforce = ["change-rationale", "review-coverage", "testing-explanation"]

[[enforcement_rules]]
when = { change-triviality = ["bounded_behavior"] }
enforce = [
    "title-format",
    "summary-section",
    "change-rationale",
    "description-coverage",
]
soft_enforce = ["review-coverage", "testing-explanation"]

[[enforcement_rules]]
when = { change-triviality = ["substantive", "incompatible"] }
enforce = [
    "title-format",
    "summary-section",
    "change-rationale",
    "description-coverage",
    "review-coverage",
]
soft_enforce = ["testing-explanation"]
