[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr-review-router"
version = "0.1.0"
description = "An advisory tool for routing pull request reviews."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "typesafe-sdk>=0.7.5,<0.8",
    "httpx2>=2.14,<3",
]

[project.scripts]
pr-review-router = "pr_review_router.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "codespell",
    "pyright>=1.1.414",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests of isolated application logic",
    "integration: tests exercising interactions through the CLI",
    "smoke: minimal checks that the installed CLI starts and completes a basic review",
]

[tool.pyright]
include = ["src/pr_review_router"]
pythonVersion = "3.12"

[tool.codespell]
skip = ["uv.lock", "build", "dist", ".venv", ".git", ".pytest_cache", ".ruff_cache"]
# Intentional before-image spelling in the accessibility corpus fixtures.
ignore-words-list = "downlaod"
