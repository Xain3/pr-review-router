name: CI Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.10.0"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Spell check
        run: uv run --no-sync codespell
      - name: Test
        run: uv run --no-sync pytest
      - name: Build
        run: uv build
      - name: CLI smoke tests
        run: |
          uv run --no-sync pr-review-router --help
          uv run --no-sync pr-review-router --version
          uv run --no-sync pr-review-router review --input examples/diff/evidence.json --config examples/diff/policy.toml --output reports/editorial.json
          uv run --no-sync pr-review-router review --input examples/diff/concern.json --output reports/concern.json
          uv run --no-sync pr-review-router review --input examples/pr-text/valid.json --config examples/pr-text/policy.toml --output reports/pr-text-valid.json
          uv run --no-sync pr-review-router review --input examples/pr-text/invalid.json --config examples/pr-text/policy.toml --output reports/pr-text-invalid.json
          uv run --no-sync pr-review-router review --input examples/rubric/valid.json --config examples/rubric/policy.toml --output reports/rubric-valid.json
          uv run --no-sync pr-review-router review --input examples/rubric/soft_blocker.json --config examples/rubric/policy.toml --output reports/rubric-soft.json
          uv run --no-sync pr-review-router review --input examples/rubric/hard_blocker.json --config examples/rubric/policy.toml --output reports/rubric-hard.json
          uv run --no-sync python -c 'import json; from pathlib import Path; a = json.loads(Path("reports/editorial.json").read_text()); b = json.loads(Path("reports/concern.json").read_text()); c = json.loads(Path("reports/pr-text-valid.json").read_text()); d = json.loads(Path("reports/pr-text-invalid.json").read_text()); e = json.loads(Path("reports/rubric-valid.json").read_text()); f = json.loads(Path("reports/rubric-soft.json").read_text()); g = json.loads(Path("reports/rubric-hard.json").read_text()); assert a["outcome"] == "skipped"; assert b["outcome"] == "needs_human_review"; assert c["pr_text"]["valid"] is True; assert d["pr_text"]["valid"] is False; assert e["rubric"]["score"] == 100; assert f["rubric"]["score"] == 80 and f["rubric"]["passed"]; assert not g["rubric"]["passed"] and g["rubric"]["failed_hard_blockers"] == ["testing"]'
      - name: Validate installed wheel
        run: |
          uv venv /tmp/router-wheel
          uv pip install --python /tmp/router-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/router-wheel/bin/pr-review-router --help
          /tmp/router-wheel/bin/pr-review-router --version
          /tmp/router-wheel/bin/pr-review-router review --input "$GITHUB_WORKSPACE/examples/diff/evidence.json" --config "$GITHUB_WORKSPACE/examples/diff/policy.toml"
