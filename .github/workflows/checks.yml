name: CI Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Spell check
        run: uv run --no-sync codespell
      - name: Unit tests
        run: uv run --no-sync pytest -m unit
      - name: Smoke tests
        run: uv run --no-sync pytest -m smoke
      - name: Integration tests
        run: uv run --no-sync pytest -m integration
      - name: Build
        run: uv build
      - name: Validate installed wheel
        run: |
          uv venv /tmp/router-wheel
          uv pip install --python /tmp/router-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/router-wheel/bin/pr-review-router --help
          /tmp/router-wheel/bin/pr-review-router --version
          /tmp/router-wheel/bin/pr-review-router review --input "$GITHUB_WORKSPACE/examples/diff/evidence.json" --config "$GITHUB_WORKSPACE/examples/diff/policy.toml"
